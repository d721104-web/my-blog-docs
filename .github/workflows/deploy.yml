name: 自動建置並部署至 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 設定權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署任務進行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 安裝相依套件
        run: npm install

      - name: 編譯 Markdown 網站 (VitePress Build)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run docs:build

      - name: 上傳成品至 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: 部署網站
    steps:
      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
